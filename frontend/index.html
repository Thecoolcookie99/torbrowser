<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tor Gateway Test</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121a2f;
        --panel-alt: #1c2747;
        --text: #edf3ff;
        --muted: #b8c3dd;
        --accent: #72d6ff;
        --border: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #09111d 0%, var(--bg) 100%);
        color: var(--text);
      }

      #app {
        width: min(1200px, calc(100vw - 32px));
        margin: 32px auto;
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      .card {
        background: rgba(18, 26, 47, 0.94);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      #loader {
        padding: 32px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.5;
      }

      form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      input {
        flex: 1 1 400px;
        min-width: 220px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
      }

      button {
        border: none;
        background: linear-gradient(135deg, var(--accent), #4ea8ff);
        color: #04111d;
        font-weight: 700;
        border-radius: 12px;
        padding: 14px 18px;
        cursor: pointer;
      }

      #preview {
        border-radius: 18px;
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .status {
        color: var(--muted);
        font-size: 0.95rem;
      }

      iframe {
        width: 100%;
        height: 78vh;
        min-height: 500px;
        border: 0;
        background: white;
      }

      @media (max-width: 640px) {
        #app {
          width: min(100vw - 16px, 1200px);
          margin: 16px auto;
        }

        #loader {
          padding: 20px;
        }

        .toolbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loader" class="screen active card">
        <h1>Tor gateway test</h1>
        <p>Enter a hidden service URL or an onion host. This page stays on the same domain and loads the target in-place without redirects.</p>
        <form id="gateway-form">
          <input
            id="onion-url"
            type="text"
            value="http://tordexu73joywapk2txdr54jed4imqledpcvcuf75qsas2gwdgksvnyd.onion/"
            placeholder="http://example.onion/"
            aria-label="Onion URL"
          />
          <button type="submit">Open</button>
        </form>
      </div>

      <div id="preview" class="screen">
        <div class="toolbar card">
          <button id="back-button" type="button">Back</button>
          <div id="status" class="status">Loading hidden service...</div>
        </div>
        <iframe id="preview-frame" title="Onion preview"></iframe>
      </div>
    </div>

    <script>
      const form = document.getElementById('gateway-form');
      const loader = document.getElementById('loader');
      const preview = document.getElementById('preview');
      const frame = document.getElementById('preview-frame');
      const status = document.getElementById('status');
      const input = document.getElementById('onion-url');
      const backButton = document.getElementById('back-button');

      function normalizeUrl(value) {
        const trimmed = value.trim();
        if (!trimmed) return '';

        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        if (/^(?:[a-z2-7]{16,56}|[a-z0-9-]+(?:\.[a-z0-9-]+)*)\.onion(?:\/.*)?$/i.test(trimmed)) {
          return `http://${trimmed}`;
        }

        return `https://${trimmed}`;
      }

      function buildGatewayTarget(value) {
        const url = new URL(value);
        if (!url.hostname.toLowerCase().endsWith('.onion')) {
          return url.toString();
        }

        const host = url.hostname.toLowerCase();
        const pathname = url.pathname || '/';
        const search = url.search || '';
        return `/http://${host}${pathname}${search}`;
      }

      function showPreview() {
        loader.classList.remove('active');
        preview.classList.add('active');
      }

      function showLoader() {
        preview.classList.remove('active');
        loader.classList.add('active');
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const normalized = normalizeUrl(input.value);
        if (!normalized) {
          status.textContent = 'Please enter an onion URL.';
          showLoader();
          return;
        }

        showLoader();
        status.textContent = 'Loading hidden service...';

        const gatewayTarget = buildGatewayTarget(normalized);
        setTimeout(() => {
          frame.src = gatewayTarget;
          status.textContent = gatewayTarget;
          showPreview();
        }, 1200);
      });

      backButton.addEventListener('click', () => {
        frame.removeAttribute('src');
        showLoader();
      });
    </script>
  </body>
</html>
